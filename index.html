<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthReach Creators - AI/Tech Influencer Marketing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 30, 60, 0.90), rgba(0, 30, 60, 0.90)), 
                        url('logo.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
        }
        
        .logo-section {
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #4FC3F7, #FF6B35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 1.3rem;
            color: #B3E5FC;
            margin-bottom: 2rem;
        }
        
        .description {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 3rem;
            color: #E1F5FE;
        }
        
        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .cta-button {
            display: inline-block;
            padding: 1.2rem 2.5rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .contact-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8A5B);
            color: white;
        }
        
        .instagram-btn {
            background: linear-gradient(135deg, #4FC3F7, #29B6F6);
            color: white;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .tagline { font-size: 1.1rem; }
            .description { font-size: 1rem; }
            .cta-buttons { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <h1>NORTHREACH CREATORS</h1>
            <p class="tagline">AI/Tech Influencer Marketing Agency</p>
        </div>
        
        <p class="description">
            Connecting AI/Tech brands with engaged YouTube & Instagram creators. 
            Our curated network of 25k-4M+ subscriber creators produces high-quality 
            content for tech-savvy audiences who trust their recommendations.
        </p>
        
        <div class="cta-buttons">
            <a href="mailto:mohammad@northreachcreators.com" class="cta-button contact-btn">
                Contact Us
            </a>
            <a href="https://www.instagram.com/northreachcreators?igsh=M2s3YjJjZDVibmZv&utm_source=qr" 
               target="_blank" 
               class="cta-button instagram-btn">
                Follow on Instagram
            </a>
        </div>
    </div>
</body>
</html>
